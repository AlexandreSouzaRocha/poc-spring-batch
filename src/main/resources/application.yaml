spring:
  application:
    name: saldo.batch

  threads:
    virtual:
      enabled: true

  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/saldo_batch?directConnection=true}
    database: ${SPRING_MONGODB_DATABASE:saldo_batch}
  data:
    mongodb:
      auto-index-creation: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 20
        batch.size: 131072
        compression.type: lz4
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        # generoso: só chamamos poll() de novo depois que o arquivo inteiro termina de processar
        max.poll.interval.ms: 1800000
        # member-id fixo por container: evita rebalance desnecessário em restart rápido
        group.instance.id: ${APP_CONSUMER_INSTANCE_ID:${HOSTNAME:local-instance}}
        # round-robin em vez do range default: com menos consumers que partições (ex.: teste de
        # capacidade com 3 containers/10 partições), o range assignor dá faixas contíguas e pode
        # concentrar todo o tráfego real (dígitos 0,1,2) num único consumer; round-robin distribui
        # ciclicamente partição a partição, garantindo 1 dígito real por container ativo
        partition.assignment.strategy: org.apache.kafka.clients.consumer.RoundRobinAssignor
    listener:
      ack-mode: manual_immediate

server:
  port: ${SERVER_PORT:8081}

app:
  storage: ${APP_STORAGE:file}
  input-dir: ${APP_INPUT_DIR:./data}
  blob:
    endpoint: ${APP_BLOB_ENDPOINT:http://localhost:10000/devstoreaccount1}
    account-name: ${APP_BLOB_ACCOUNT_NAME:devstoreaccount1}
    account-key: ${APP_BLOB_ACCOUNT_KEY:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
    container: ${APP_BLOB_CONTAINER:saldo-files}
  chunk-size: ${APP_CHUNK_SIZE:5000}
  partitions-per-file: ${APP_PARTITIONS_PER_FILE:10}
  kafka-topic: ${APP_KAFKA_TOPIC:saldo-contas}
  file-processor:
    topic: ${APP_FILE_PROCESSOR_TOPIC:saldo-file-processor}
    dlq-topic: ${APP_FILE_PROCESSOR_DLQ_TOPIC:saldo-file-processor.dlq}
    group-id: ${APP_FILE_PROCESSOR_GROUP_ID:saldo-file-processor-group}
    max-attempts: ${APP_FILE_PROCESSOR_MAX_ATTEMPTS:6}
    retry-backoff-seconds: ${APP_FILE_PROCESSOR_RETRY_BACKOFF_SECONDS:10}
    lock-ttl-seconds: ${APP_FILE_PROCESSOR_LOCK_TTL_SECONDS:1800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.batch: INFO
    br.com.saldo.batch: INFO
