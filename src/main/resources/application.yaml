spring:
  application:
    name: saldo.batch

  threads:
    virtual:
      enabled: true

  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/saldo_batch?directConnection=true}
    database: ${SPRING_MONGODB_DATABASE:saldo_batch}
  data:
    mongodb:
      auto-index-creation: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 20
        batch.size: 65536
        compression.type: lz4
        max.in.flight.requests.per.connection: 5

server:
  port: ${SERVER_PORT:8081}

app:
  storage: ${APP_STORAGE:file}
  input-dir: ${APP_INPUT_DIR:./data}
  blob:
    endpoint: ${APP_BLOB_ENDPOINT:http://localhost:10000/devstoreaccount1}
    account-name: ${APP_BLOB_ACCOUNT_NAME:devstoreaccount1}
    account-key: ${APP_BLOB_ACCOUNT_KEY:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
    container: ${APP_BLOB_CONTAINER:saldo-files}
  chunk-size: ${APP_CHUNK_SIZE:5000}
  partitions-per-file: ${APP_PARTITIONS_PER_FILE:10}
  kafka-topic: ${APP_KAFKA_TOPIC:saldo-contas}
  digit-from: ${APP_DIGIT_FROM:0}
  digit-to: ${APP_DIGIT_TO:9}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.batch: INFO
    com.bradesco.saldo.batch: INFO
