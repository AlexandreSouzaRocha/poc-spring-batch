services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft, single broker). Dual listeners:
  #  - HOST://localhost:9092    -> app rodando no host
  #  - INTERNAL://kafka:29092   -> outros containers (kafka-ui)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: poc-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 5000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: poc-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: poc-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "2", "--setParameter", "transactionLifetimeLimitSeconds=300"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Azure Blob Storage local (emulador). Blob endpoint em :10000.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: poc-azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck", "--disableProductStyleUrl", "--location", "/data"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7
    container_name: poc-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo-init.sh:/init/mongo-init.sh:ro
    entrypoint: ["bash", "/init/mongo-init.sh"]
    restart: "no"

  app-1:
    build:
      context: .
    image: poc-saldo-batch:latest
    container_name: poc-app-1
    ports:
      - "8081:8081"
    environment: &app-env
      SPRING_MONGODB_URI: mongodb://mongo:27017/saldo_batch?directConnection=true
      SPRING_MONGODB_DATABASE: saldo_batch
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_STORAGE: blob
      APP_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
      APP_BLOB_ACCOUNT_NAME: devstoreaccount1
      APP_BLOB_ACCOUNT_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
      APP_BLOB_CONTAINER: saldo-files
      APP_CHUNK_SIZE: 5000
      APP_PARTITIONS_PER_FILE: 8
      JAVA_TOOL_OPTIONS: "-Djdk.tracePinnedThreads=full -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=30.0 --sun-misc-unsafe-memory-access=allow"
    depends_on: &app-depends
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy

  app-2:
    image: poc-saldo-batch:latest
    container_name: poc-app-2
    ports:
      - "8082:8081"
    environment: *app-env
    depends_on: *app-depends

  app-3:
    image: poc-saldo-batch:latest
    container_name: poc-app-3
    ports:
      - "8083:8081"
    environment: *app-env
    depends_on: *app-depends

  app-4:
    image: poc-saldo-batch:latest
    container_name: poc-app-4
    ports:
      - "8084:8081"
    environment: *app-env
    depends_on: *app-depends

  app-5:
    image: poc-saldo-batch:latest
    container_name: poc-app-5
    ports:
      - "8085:8081"
    environment: *app-env
    depends_on: *app-depends

  app-6:
    image: poc-saldo-batch:latest
    container_name: poc-app-6
    ports:
      - "8086:8081"
    environment: *app-env
    depends_on: *app-depends

  app-7:
    image: poc-saldo-batch:latest
    container_name: poc-app-7
    ports:
      - "8087:8081"
    environment: *app-env
    depends_on: *app-depends

  app-8:
    image: poc-saldo-batch:latest
    container_name: poc-app-8
    ports:
      - "8088:8081"
    environment: *app-env
    depends_on: *app-depends

  app-9:
    image: poc-saldo-batch:latest
    container_name: poc-app-9
    ports:
      - "8089:8081"
    environment: *app-env
    depends_on: *app-depends

  app-10:
    image: poc-saldo-batch:latest
    container_name: poc-app-10
    ports:
      - "8090:8081"
    environment: *app-env
    depends_on: *app-depends

volumes:
  azurite-data:
  mongo-data:
